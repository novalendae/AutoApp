name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android Project & Build APKs
        run: |
          # 1. Localiza onde está o build.gradle(.kts)
          BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "❌ Erro: Nenhum arquivo build.gradle encontrado no repositório!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "📁 Diretório do projeto Android encontrado: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. Verifica se o gradlew existe; se não existir, gera usando o gradle global
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ gradlew não encontrado. Gerando o wrapper do Gradle..."
            gradle wrapper || gradle wrapper --gradle-version 8.7
          fi

          chmod +x ./gradlew

          # 3. Compila os APKs
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaizen-auto-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaizen-auto-release-apk
          path: '**/build/outputs/apk/release/*.apk'
          retention-days: 14
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/build/outputs/apk/**/*.apk'
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
